# Loaded on top of the main application.yml in every backend test.
spring:
  datasource:
    hikari:
      # The shared containers are gone by the time the JVM closes the cached contexts, and the event publication
      # registry still wants the database then. Without this (in ms) each context would wait 30 s for it.
      connection-timeout: 2000
  http:
    clients:
      # Short, so that the timeout test does not wait for long.
      read-timeout: 500ms
bits:
  role-sync:
    # Tests start syncs themselves and do not wait between WarEra calls.
    cron: "-"
    user-lookup-interval: 0s
  cleanup:
    # Tests clean up themselves.
    cron: "-"
  system-log:
    cleanup-cron: "-"
  embassy:
    cron: "-"
    creation-cron: "-"
  overview:
    snapshot-cron: "-"
  vote:
    cron: "-"
  auth:
    public-url: https://bits.test
    jwt-secret: test-signing-key-that-is-at-least-32-bytes-long
    discord:
      client-id: test-client
      client-secret: test-client-secret
      guild-id: "100"
