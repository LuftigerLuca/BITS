spring:
  application:
    name: bits-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bits}
    username: ${DB_USER:bits}
    password: ${DB_PASSWORD:bits}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  http:
    clients:
      # For WarEra and Discord. Without them a hanging connection blocks its thread for good, and the role sync has
      # only one. WarEra answers within a second when it is well; 10 s leaves room for slow pages.
      connect-timeout: 5s
      read-timeout: 10s
  modulith:
    events:
      # Handed-out events are removed from the registry; the stream is where they live on.
      completion-mode: delete
      republish-outstanding-events-on-restart: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Set in the deployment, where Redis has a user per service; empty locally.
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}

bits:
  service-token: ${BITS_SERVICE_TOKEN:}
  warera:
    base-url: ${WARERA_BASE_URL:https://api2.warera.io/trpc}
  role-sync:
    cron: "0 0 * * * *"
  # Deletes data BITS no longer needs, see "Datenschutz" in the README.
  cleanup:
    cron: "0 30 * * * *"
  system-log:
    # Once a day is enough for entries kept 30 days.
    cleanup-cron: "0 15 3 * * *"
  auth:
    public-url: ${BITS_PUBLIC_URL:http://localhost:5173}
    jwt-secret: ${BITS_JWT_SECRET:}
    discord:
      client-id: ${DISCORD_CLIENT_ID:}
      client-secret: ${DISCORD_CLIENT_SECRET:}
      guild-id: ${DISCORD_GUILD_ID:}
    admin:
      username: ${BITS_ADMIN_USERNAME:}
      password-hash: ${BITS_ADMIN_PASSWORD_HASH:}

server:
  # The dashboard reaches the backend through nginx; the client IP for the login lockout comes from X-Forwarded-For.
  forward-headers-strategy: native
  servlet:
    session:
      # Only the Discord login uses the HTTP session, from the redirect to Discord until the way back. Lax, since that
      # way back is a navigation from discord.com. Browsers accept Secure cookies on http://localhost too.
      timeout: 10m
      cookie:
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
