version: 2

# Minor and patch updates are grouped into one PR per ecosystem, major updates get their own PRs.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions are pinned by commit SHA with the version as a comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # Images are pinned by digest next to their tag; Dependabot updates both. Major versions of base images and
  # services are upgraded by hand: the JDK is tied to the Gradle toolchain, PostgreSQL needs a data migration.
  - package-ecosystem: docker
    directories: [/backend, /bot, /frontend]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      docker:
        patterns: ["*"]

  # The local stack and the deployed one use the same images.
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      docker-compose:
        patterns: ["*"]
