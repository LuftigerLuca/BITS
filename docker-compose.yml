# Local stack for development. Every port is bound to the loopback interface: Docker bypasses the host firewall, and
# Redis runs without password here. To reach a service from another device, change its binding deliberately.
services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_DB: bits
      POSTGRES_USER: bits
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bits}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bits -d bits"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bits
      DB_USER: bits
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bits}
      REDIS_HOST: redis
      BITS_SERVICE_TOKEN: ${BITS_SERVICE_TOKEN:?BITS_SERVICE_TOKEN must be set}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?DISCORD_GUILD_ID must be set}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID must be set}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET must be set}
      BITS_PUBLIC_URL: ${BITS_PUBLIC_URL:-http://localhost:5173}
      BITS_JWT_SECRET: ${BITS_JWT_SECRET:?BITS_JWT_SECRET must be set}
      BITS_ADMIN_USERNAME: ${BITS_ADMIN_USERNAME:-}
      BITS_ADMIN_PASSWORD_HASH: ${BITS_ADMIN_PASSWORD_HASH:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN must be set}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?DISCORD_GUILD_ID must be set}
      BACKEND_URL: http://backend:8080
      BITS_SERVICE_TOKEN: ${BITS_SERVICE_TOKEN:?BITS_SERVICE_TOKEN must be set}
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: frontend
    ports:
      - "127.0.0.1:5173:8080"

volumes:
  postgres-data:
  redis-data:
