# Included in every location, since a location with an add_header of its own inherits none from above.
# HSTS is left to the TLS proxy, which knows whether HTTPS is in place (see deploy/README.md).
#
# Scripts and styles come from the app itself; styles also inline, as some UI components inject <style> elements.
# Avatars are loaded from Discord's CDN. No page may frame the dashboard, against clickjacking of the admin area.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
