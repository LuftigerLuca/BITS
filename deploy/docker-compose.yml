# Deployed stack. The CD workflow copies this file and a generated .env into the deployment directory on
# the target host, then runs `docker compose up -d`. The project name comes from COMPOSE_PROJECT_NAME in
# that .env, so several environments can share a host.
#
# Only the frontend is published, and only on the loopback interface unless PUBLIC_BIND says otherwise.
# Its nginx forwards the dashboard's endpoints (/auth, /web) to the backend; the bot's API (/api) is
# reachable inside the compose network only. The bot needs no inbound connection, it dials out to Discord.
#
# Three networks keep the frontend, the one service reachable from outside, away from the data: edge holds the
# frontend and the backend, internal the backend, the bot, Postgres and Redis, without a way out, and egress
# gives the bot its way to Discord. Code that runs in the frontend container reaches neither Postgres nor Redis,
# and so cannot write events that the bot would act on.

# What every container gets: it cannot gain privileges it did not start with, and it starts with no Linux
# capabilities at all. A service that needs some back names them itself.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Memory limits keep one service that gets out of hand from taking the host down with it. The defaults
# fit a small host; each can be raised through the variable named.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *hardening
    # The entrypoint starts as root to take ownership of a fresh data directory and then hands over to
    # the postgres user. These are what that step needs.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: ${POSTGRES_MEMORY:-512m}
    networks: [internal]
    environment:
      POSTGRES_DB: bits
      POSTGRES_USER: bits
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bits -d bits"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    <<: *hardening
    # Like Postgres, the entrypoint fixes the ownership of the data directory before dropping root.
    cap_add: [CHOWN, SETGID, SETUID]
    mem_limit: ${REDIS_MEMORY:-256m}
    networks: [internal]
    # Append-only, so events the bot has not acknowledged yet survive a restart. AOF rewrites keep their defaults;
    # the data is small, the stream is trimmed to a week.
    #
    # maxmemory stays well below the container's limit, which also has to hold the copy-on-write pages of the fork
    # that rewrites the AOF. noeviction, since nothing here may silently disappear: neither a login lockout nor an
    # event the bot has not read. When memory is full, writes fail with an error the backend logs, and Redis keeps
    # running instead of being killed by the kernel.
    #
    # Each service has its own user. The backend may do everything except the dangerous commands, on its own keys.
    # The bot may only read the event stream with its consumer group and write to the dead-letter stream, so it
    # cannot fake an event. The default user, without password, is left with PING for the healthcheck. Redis
    # replaces its command line in the process list, so the passwords do not show up there.
    # Compose splits the command into words like a shell would, but runs no shell; the quotes keep `>`, `|` and the
    # parentheses from being read as redirection, pipe and subshell. Redis reads the words after each --user as one
    # rule set.
    command: >-
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-128mb}
      --maxmemory-policy noeviction
      --user default on nopass resetkeys resetchannels -@all +ping
      --user backend on '>${REDIS_BACKEND_PASSWORD:?REDIS_BACKEND_PASSWORD is required}' resetchannels ~bits:* +@all -@dangerous +info
      --user bot on '>${REDIS_BOT_PASSWORD:?REDIS_BOT_PASSWORD is required}' resetchannels ~bits:events -@all +hello '+client|setinfo'
      +ping +exists +xreadgroup +xack +xpending +xclaim '+xgroup|create' '+xinfo|groups' '(~bits:events:dead +xadd)'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    <<: *hardening
    # Writes nowhere but to a scratch directory for the JVM.
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    # The JVM sizes its heap to 25 % of this by default.
    mem_limit: ${BACKEND_MEMORY:-768m}
    networks: [edge, internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bits
      DB_USER: bits
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_USERNAME: backend
      REDIS_PASSWORD: ${REDIS_BACKEND_PASSWORD}
      BITS_SERVICE_TOKEN: ${BITS_SERVICE_TOKEN:?BITS_SERVICE_TOKEN is required}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?DISCORD_GUILD_ID is required}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}
      BITS_PUBLIC_URL: ${BITS_PUBLIC_URL:?BITS_PUBLIC_URL is required}
      BITS_JWT_SECRET: ${BITS_JWT_SECRET:?BITS_JWT_SECRET is required}
      BITS_ADMIN_USERNAME: ${BITS_ADMIN_USERNAME:-}
      BITS_ADMIN_PASSWORD_HASH: ${BITS_ADMIN_PASSWORD_HASH:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      # Flyway migrates on startup, which can take a while.
      start_period: 60s
      retries: 6

  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE is required}
    restart: unless-stopped
    <<: *hardening
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${BOT_MEMORY:-512m}
    networks: [internal, egress]
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      BACKEND_URL: http://backend:8080
      BITS_SERVICE_TOKEN: ${BITS_SERVICE_TOKEN}
      REDIS_URL: redis://bot:${REDIS_BOT_PASSWORD}@redis:6379

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    <<: *hardening
    # The image runs nginx as an unprivileged user on port 8080 (see frontend/Dockerfile).
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${FRONTEND_MEMORY:-64m}
    networks: [edge]
    environment:
      # Address of the TLS proxy in front, the only peer whose X-Forwarded-For nginx believes (see
      # frontend/nginx.conf.template). The default believes nobody.
      REAL_IP_FROM: ${REAL_IP_FROM:-127.0.0.1}
    # A proxy on another host needs an address it can reach: name the interface that faces it in
    # PUBLIC_BIND rather than 0.0.0.0, and let the firewall decide who may talk to it.
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  edge:
  internal:
    internal: true
  egress:

volumes:
  postgres-data:
  redis-data:
